# Sloped-wall (80 deg) line grating modeled as a vacuum groove, TM (M8-3)
schema_version: 1
domain: {Lx: 48, Ly: 8, z_min: -16, z_max: 56}
materials:
  absorber: {n: 0.95, k: 0.031}
layers:
  - {z: [0, 40], material: absorber}
frustums:
  - vertices: [[24, 0], [48, 0], [48, 8], [24, 8]]
    z0: 0
    h: 40
    alpha: 100        # groove alpha 100 <=> line wall alpha 80
    epsilon: 1.0
wavelength: 13.5
sources:
  - type: planewave
    incidence: {theta: 6, phi: 0, from: top}
    polarization: p
fem: {order: 3, elems_per_wavelength: 8}
boundaries:
  pml: {thickness: 0.75}
output:
  planes:
    - {z: 50, quantities: [E], resolution: [32, 4], file: top.h5}
    - {z: -10, quantities: [E], resolution: [32, 4], file: bottom.h5}
  orders: {enabled: true}
